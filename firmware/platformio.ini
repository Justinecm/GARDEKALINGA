; PlatformIO project for the Box B firmware.
;   pio run -e esp32dev            build and flash (Arduino IDE also works: open gardekalinga_node/)
;   pio test -e native             unit tests of the pure logic on the PC (Unity)
[platformio]
src_dir = gardekalinga_node
test_dir = test

[env:esp32dev]
; Arduino-ESP32 core 3.x (ESP-IDF 5) is required; the official platform still ships 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.1
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=1

; TC13 only: adds the manager test command that stops feeding the watchdog.
[env:esp32dev-test-hang]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DGK_TEST_HANG=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
